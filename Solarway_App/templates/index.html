<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SolarWay - Control de LEDs</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"
integrity="sha384-..." crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrap">
        
        <div class="top">
            <img src="/static/img/SOLARWAY.png" alt="Logo SolarWay" class="logo" />
            <button id="connect-ble-btn" class="btn connect-btn">
                🔗 Conectar
            </button>
        </div>

        <div class="matrix-and-info">
            
            <div class="card controls">
                <h1>Control de LEDs</h1>
                
                <div id="led-matrix" class="matrix">
                </div>
                
                <div class="actions">
                    <button id="turn-all-on" class="btn">Encender Todos</button>
                    <button id="turn-all-off" class="btn outline">Apagar Todos</button>
                </div>
            </div>

            <div class="info">

                <div class="card battery small">
                    <div class="battery-title">Batería</div>
                    <div class="battery-bar">
                        <div id="battery-level" class="battery-level"></div>
                    </div>
                    <div id="battery-text" class="battery-text">0% (0.00V)</div>
                </div>

                <div class="card">
                    <div class="battery-title">Seleccionar Patrón</div>
                    <div id="court-list" class="court-list">
                        </div>
                </div>

                <div class="card">
                    <div class="battery-title">Avisos</div>
                    <div id="alerts-list" class="alerts-list">Sin avisos.</div>
                </div>

            </div>

        </div> 
        
        <footer class="foot">
            SolarWay — panel de control minimalista
        </footer>
        
    </div> 

    <div id="ble-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Conectar Dispositivo SolarWay</h2>
            <p id="current-status">Estado: Desconectado</p>
            <button id="scan-btn" class="btn full-width">Buscar Dispositivos</button>
            <div id="device-list" class="device-list">
                <p style="margin-top: 10px; color: var(--muted);">Presiona "Buscar Dispositivos" para escanear.</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
